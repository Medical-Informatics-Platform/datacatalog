server {
    listen 80;

    # Serve Angular app
    root /usr/share/nginx/html;
    index index.html;

    # Route other API requests to the backend
    location /services/ {
        proxy_pass http://backend:8090; # Use the service name from docker-compose
        # The backend builds its OAuth2 redirect URI from this Host header. Keep exact
        # redirect URIs (no wildcards) on the Keycloak client, so a forged Host is refused.
        proxy_set_header Host $host; # nosemgrep: request-host-used
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Fallback to index.html for Angular routing
    location / {
        try_files $uri /index.html;
    }
}
