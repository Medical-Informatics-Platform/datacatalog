server {
    listen 80;
    # Substituted at container start from PUBLIC_HOSTNAME (see
    # docker-entrypoint.d/00-public-hostname.envsh). The backend builds its
    # OAuth2 redirect URI from this name. It is the configured public host,
    # not the client Host header.
    server_name ${PUBLIC_HOSTNAME};

    # Serve Angular app
    root /usr/share/nginx/html;
    index index.html;

    # Route other API requests to the backend
    location /services/ {
        proxy_pass http://backend:8090; # Use the service name from docker-compose
        proxy_set_header Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Fallback to index.html for Angular routing
    location / {
        try_files $uri /index.html;
    }
}
